<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="redSeaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcf9f1"/>
      <stop offset="100%" stop-color="#f2ead7"/>
    </linearGradient>
    <pattern id="redSeaGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#d6ccb5" stroke-width="0.7" stroke-dasharray="3,3"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#redSeaBg)" rx="12"/>
  <rect x="28" y="20" width="744" height="460" fill="url(#redSeaGrid)" stroke="#78350f" stroke-width="2" rx="6"/>

  <!-- 100m Contour -->
  <path d="M 90 385 C 165 425 320 432 480 412 C 630 392 695 340 702 250 C 710 155 645 92 480 86 C 280 80 120 138 88 236 C 68 296 68 355 90 385 Z"
        fill="#fef3c7" fill-opacity="0.45" stroke="#92400e" stroke-width="2.4"/>

  <!-- 150m Contour (much closer on eastern side = steep cliff) -->
  <path d="M 160 344 C 235 376 360 382 515 362 C 640 344 678 302 684 242 C 690 176 635 124 495 120 C 330 116 188 164 156 236 C 138 278 138 322 160 344 Z"
        fill="#fde68a" fill-opacity="0.42" stroke="#92400e" stroke-width="2.4"/>

  <!-- 200m Contour (very tight on east) -->
  <path d="M 245 304 C 310 330 410 336 550 318 C 642 304 662 270 666 234 C 670 192 628 158 518 154 C 385 150 265 186 238 234 C 224 260 226 288 245 304 Z"
        fill="#fcd34d" fill-opacity="0.48" stroke="#78350f" stroke-width="2.6"/>

  <!-- 250m Ridge Summit -->
  <path d="M 355 268 C 410 284 485 286 580 272 C 635 262 646 240 648 222 C 650 200 618 184 542 182 C 445 180 365 204 348 232 C 340 248 342 260 355 268 Z"
        fill="#d97706" fill-opacity="0.58" stroke="#451a03" stroke-width="2.8"/>

  <!-- Elevation Labels -->
  <g font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="900" fill="#78350f">
    <rect x="112" y="160" width="44" height="16" rx="3" fill="#fcf9f1" fill-opacity="0.92"/>
    <text x="134" y="172" text-anchor="middle">100م</text>
    <rect x="186" y="182" width="44" height="16" rx="3" fill="#fef3c7" fill-opacity="0.92"/>
    <text x="208" y="194" text-anchor="middle">150م</text>
    <rect x="268" y="204" width="44" height="16" rx="3" fill="#fde68a" fill-opacity="0.92"/>
    <text x="290" y="216" text-anchor="middle">200م</text>
    <text x="495" y="236" font-size="13" fill="#ffffff" text-anchor="middle">250م ▲</text>
  </g>

  <!-- Steep Eastern Slope Label -->
  <rect x="572" y="346" width="175" height="22" rx="5" fill="#fee2e2" fill-opacity="0.95" stroke="#dc2626" stroke-width="1"/>
  <text x="660" y="361" font-family="'Noto Sans Arabic', sans-serif" font-size="10" font-weight="900" fill="#991b1b" text-anchor="middle">الجانب الشرقي (تقارب شديد = جرف)</text>

  <!-- Title Banner -->
  <g transform="translate(42, 32)">
    <rect x="0" y="0" width="335" height="32" fill="#ffffff" fill-opacity="0.96" rx="8" stroke="#92400e" stroke-width="1.5"/>
    <text x="168" y="20" font-family="'Noto Sans Arabic', sans-serif" font-size="12" font-weight="900" fill="#78350f" text-anchor="middle">خريطة كنتورية لتلال البحر الأحمر (شرق السودان)</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(725, 70)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" fill-opacity="0.96" stroke="#78350f" stroke-width="2"/>
    <polygon points="0,-21 6,0 0,-4 -6,0" fill="#dc2626"/>
    <polygon points="0,21 6,0 0,4 -6,0" fill="#475569"/>
    <text x="0" y="-23" font-family="'Noto Sans Arabic', sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">ش</text>
  </g>
</svg>
