<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#f8fafc" />

  <!-- Principal Axis (المحور الرئيسي) -->
  <line x1="50" y1="250" x2="950" y2="250" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6" />
  <text x="960" y="255" fill="#64748b" font-size="16" font-family="sans-serif">المحور الرئيسي</text>

  <!-- Incident rays (left) -->
  <!-- Ray 1 -->
  <line x1="100" y1="150" x2="300" y2="150" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="300" y1="150" x2="490" y2="150" stroke="#ef4444" stroke-width="2.5" />
  <!-- Converging Ray 1 -->
  <line x1="490" y1="150" x2="650" y2="210" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="650" y1="210" x2="750" y2="250" stroke="#ef4444" stroke-width="2.5" />
  <line x1="750" y1="250" x2="850" y2="290" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Ray 2 (Bottom) -->
  <line x1="100" y1="350" x2="300" y2="350" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="300" y1="350" x2="490" y2="350" stroke="#ef4444" stroke-width="2.5" />
  <!-- Converging Ray 2 -->
  <line x1="490" y1="350" x2="650" y2="290" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="650" y1="290" x2="750" y2="250" stroke="#ef4444" stroke-width="2.5" />
  <line x1="750" y1="250" x2="850" y2="210" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Convex Lens Body (x=500, y=250, rx=50, ry=175) -->
  <path d="M 500 75 Q 550 250 500 425 Q 450 250 500 75 Z" fill="url(#lensGrad)" stroke="#2563eb" stroke-width="3" />
  
  <!-- Optical Center O -->
  <circle cx="500" cy="250" r="4" fill="#1e3a8a" />
  <text x="495" y="275" font-size="16" font-family="sans-serif" font-weight="bold" fill="#1e3a8a">O</text>

  <!-- Focal Point F' (Left, x=250, y=250) -->
  <circle cx="250" cy="250" r="5" fill="#0f172a" />
  <text x="245" y="280" font-size="20" font-family="sans-serif" font-weight="bold" fill="#0f172a">F′</text>

  <!-- Primary Focal Point F (Right, x=750, y=250) -->
  <circle cx="750" cy="250" r="6" fill="#dc2626" />
  <text x="745" y="285" font-size="22" font-family="sans-serif" font-weight="bold" fill="#dc2626">F</text>
</svg>
